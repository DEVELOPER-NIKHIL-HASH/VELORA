
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0B0C" />

    <meta
      name="description"
      content="VELORA — The Art of Everyday Luxury. Exceptional finds. Independent sellers. A marketplace designed around you."
    />

    <!-- VELORA Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=10" />

    <!-- Google Fonts: Cormorant Garamond (Editorial Luxury Serif) & Plus Jakarta Sans (Clean Modern Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Browser Tab Title -->
    <title>VELORA | The Art of Everyday Luxury</title>

    <!-- Prevent theme flash before React mounts -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem("velora_theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = savedTheme || (prefersDark ? "dark" : "light");
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
